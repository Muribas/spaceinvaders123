<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Space Invaders V2</title>

<style>

body{

margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


canvas{

border:3px solid lime;
background:#000;

}

</style>

</head>


<body>


<canvas id="game" width="800" height="600"></canvas>


<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");


const W=canvas.width;
const H=canvas.height;


// ======================
// ESTADOS
// ======================

let state="menu";

let mode="";

let keys={};


// ======================
// PLAYER
// ======================


let player={


x:375,

y:520,


w:50,

h:20,


speed:6,


cooldown:0,


fireRate:20


};



let bullets=[];


let score=0;

let lives=3;

let coins=0;



// ======================
// TECLADO
// ======================


document.addEventListener("keydown",e=>{


keys[e.code]=true;



if(state=="menu"){



if(e.code=="Digit1"){


mode="endless";

startGame();


}



if(e.code=="Digit2"){


mode="fases";

state="fases";


}



}



});





document.addEventListener("keyup",e=>{


keys[e.code]=false;


});




// ======================
// MENU
// ======================


function drawMenu(){


ctx.fillStyle="white";


ctx.font="45px Arial";


ctx.fillText(

"SPACE INVADERS",

160,

150

);



ctx.font="25px Arial";


ctx.fillText(

"1 - Modo Endless",

280,

260

);



ctx.fillText(

"2 - Modo Fases",

280,

320

);



}





// ======================
// INICIAR
// ======================


function startGame(){


state="playing";


player.x=375;

player.y=520;


bullets=[];


score=0;


lives=3;


createEnemies();


}



// ======================
// PLAYER
// ======================


function updatePlayer(){


if(keys["ArrowLeft"]){


player.x-=player.speed;


}



if(keys["ArrowRight"]){


player.x+=player.speed;


}



if(player.x<0)

player.x=0;



if(player.x+player.w>W)

player.x=W-player.w;





if(player.cooldown>0)

player.cooldown--;





if(keys["Space"] && player.cooldown<=0){


shoot();


player.cooldown=player.fireRate;


}



}





function shoot(){


bullets.push({


x:player.x+22,

y:player.y,

w:6,

h:15,

speed:10


});


}



// ======================
// DESENHO PLAYER
// ======================


function drawPlayer(){


ctx.fillStyle="cyan";


ctx.fillRect(

player.x,

player.y,

player.w,

player.h

);


}
// ======================
// INIMIGOS
// ======================


let enemies=[];


let enemyDirection=1;


let enemySpeed=1;


let enemyBullets=[];



// ======================
// CRIAR INIMIGOS
// ======================


function createEnemies(){


enemies=[];



for(let y=0;y<5;y++){



for(let x=0;x<10;x++){



let posY=50+y*40;



enemies.push({



x:80+x*60,


y:posY,


// guarda posição original
startY:posY,


w:35,


h:25,


alive:true,


hp:1,


// controle do retorno
returning:false



});



}



}



}





// ======================
// MOVIMENTO INIMIGOS
// ======================


function updateEnemies(){



let edge=false;



enemies.forEach(e=>{



if(!e.alive)

return;




// se estiver voltando para cima

if(e.returning){



e.y-=2;



if(e.y<=e.startY){



e.y=e.startY;


e.returning=false;


}



return;


}





// movimento normal


e.x+=enemySpeed*enemyDirection;




if(e.x<=20 || e.x+e.w>=W-20){


edge=true;


}



});






// quando bate na parede desce


if(edge){



enemyDirection*=-1;



enemies.forEach(e=>{



if(!e.returning){


e.y+=20;


}



});



}





// ======================
// LIMITE DE 120 PIXELS
// DO JOGADOR
// ======================


enemies.forEach(e=>{



if(e.y+e.h >= player.y-120){



e.returning=true;



}



});







// tiro dos inimigos


if(Math.random()<0.025){



let vivos=enemies.filter(e=>e.alive);



if(vivos.length>0){



let e=vivos[

Math.floor(Math.random()*vivos.length)

];




enemyBullets.push({



x:e.x+15,


y:e.y+25,


w:6,


h:15,


speed:5



});



}



}



}





// ======================
// DESENHAR INIMIGOS
// ======================


function drawEnemies(){



ctx.fillStyle="lime";



enemies.forEach(e=>{



if(e.alive){



ctx.fillRect(


e.x,


e.y,


e.w,


e.h


);



}



});



}





// ======================
// ATUALIZAR TIROS
// ======================


function updateBullets(){



bullets.forEach(b=>{



b.y-=b.speed;



});




enemyBullets.forEach(b=>{



b.y+=b.speed;



});





bullets=

bullets.filter(b=>b.y>-30);





enemyBullets=

enemyBullets.filter(b=>b.y<H+50);



}




// ======================
// DESENHAR TIROS
// ======================


function drawBullets(){



ctx.fillStyle="yellow";



bullets.forEach(b=>{



ctx.fillRect(


b.x,


b.y,


b.w,


b.h


);



});



}




function drawEnemyBullets(){



ctx.fillStyle="red";



enemyBullets.forEach(b=>{



ctx.fillRect(


b.x,


b.y,


b.w,


b.h


);



});



}
// ======================
// COLISÃO
// ======================


function hit(a,b){


return(


a.x < b.x+b.w &&

a.x+a.w > b.x &&

a.y < b.y+b.h &&

a.y+a.h > b.y


);


}





// ======================
// COLISÕES DOS TIROS
// ======================


function checkCollisions(){



// tiro do jogador


bullets.forEach(b=>{



enemies.forEach(e=>{



if(!e.alive)

return;



if(hit(b,e)){



e.hp--;



b.y=-100;




if(e.hp<=0){



e.alive=false;


score+=10;



let chance=Math.random()*100;



if(chance<1){


coins+=100;


}

else if(chance<26){


coins+=2;


}

else if(chance<76){


coins+=1;


}



}



}



});



});







// tiro inimigo


enemyBullets.forEach(b=>{



if(hit(b,player)){



b.y=999;



lives--;



if(lives<=0){


state="gameover";


}



}



});





enemies=enemies.filter(e=>e.alive);



}







// ======================
// HUD
// ======================


function drawHUD(){



ctx.fillStyle="white";


ctx.font="18px Arial";



ctx.fillText(


"Pontos: "+score,


20,


30


);



ctx.fillText(


"Moedas: "+coins,


20,


55


);



ctx.fillText(


"Vidas: "+lives,


20,


80


);



}







// ======================
// LOJA
// ======================


function drawShop(){



ctx.fillStyle="black";


ctx.fillRect(

0,

0,

W,

H

);




ctx.fillStyle="white";


ctx.font="40px Arial";



ctx.fillText(

"LOJA",

350,

80

);




ctx.font="22px Arial";



ctx.fillText(

"Moedas: "+coins,

30,

40

);




ctx.fillText(

"1 - Velocidade",

120,

150

);



ctx.fillText(

"2 - Tiro rapido",

120,

200

);



ctx.fillText(

"3 - Escudo",

120,

250

);



ctx.fillText(

"4 - Tiro duplo",

120,

300

);



ctx.fillText(

"5 - Perfuracao",

120,

350

);



ctx.fillText(

"ENTER continuar",

300,

500

);



}





// ======================
// SISTEMAS DO PLAYER
// ======================


player.shield=0;

player.doubleShot=0;

player.pierce=0;




let playerName=

localStorage.getItem("playerName") || "PLAYER";






// ======================
// PLAYER COM NOME
// ======================


function drawPlayer(){



ctx.fillStyle="cyan";


ctx.fillRect(


player.x,


player.y,


player.w,


player.h


);





ctx.fillStyle="white";


ctx.font="14px Arial";


ctx.fillText(


playerName,


player.x,


player.y-20


);



if(player.shield>0){



ctx.strokeStyle="blue";


ctx.lineWidth=3;


ctx.beginPath();


ctx.arc(


player.x+25,


player.y+10,


40,


0,


Math.PI*2


);


ctx.stroke();



}



}





// ======================
// TIRO DUPLO
// ======================


function shoot(){



if(player.doubleShot==0){



bullets.push({


x:player.x+22,


y:player.y,


w:6,


h:15,


speed:10


});



}





if(player.doubleShot==1){



bullets.push({


x:player.x+10,


y:player.y,


w:6,


h:15,


speed:10


});




bullets.push({


x:player.x+35,


y:player.y,


w:6,


h:15,


speed:10


});



}




if(player.doubleShot==2){



for(let i=0;i<4;i++){



bullets.push({


x:player.x+5+(i*13),


y:player.y,


w:5,


h:15,


speed:10


});



}



}







}
// ======================
// ROUNDS
// ======================


let round=1;

let boss=null;

let selectedStage=1;


let unlockedStages=

Number(localStorage.getItem("unlockedStages")) || 1;






// ======================
// FASES
// ======================


function drawStages(){


ctx.fillStyle="black";


ctx.fillRect(

0,

0,

W,

H

);




ctx.fillStyle="white";


ctx.font="35px Arial";



ctx.fillText(

"SELEÇÃO DE FASE",

250,

80

);




ctx.font="22px Arial";



for(let i=1;i<=10;i++){



let y=140+i*35;



if(i<=unlockedStages){



ctx.fillStyle="lime";


ctx.fillText(

"Fase "+i+" [LIBERADA]",

260,

y

);



}

else{



ctx.fillStyle="gray";


ctx.fillText(

"Fase "+i+" [BLOQUEADA]",

260,

y

);



}



}



ctx.fillStyle="white";


ctx.fillText(

"↑ ↓ escolher",

300,

530

);



ctx.fillText(

"ENTER jogar",

300,

560

);



}








// ======================
// DIFICULDADE
// ======================


function applyDifficulty(){



enemySpeed=

1+Math.floor(round/10)*0.5;



enemies.forEach(e=>{


e.hp=

1+Math.floor(round/10);



});



}








// ======================
// BOSS
// ======================


function createBoss(){



boss={



x:250,


y:70,


w:300,


h:100,


hp:

500*Math.pow(1.1,Math.floor(round/100)-1),



max:

500*Math.pow(1.1,Math.floor(round/100)-1),



speed:3,


dir:1



};



}







function updateBoss(){



if(!boss)

return;




boss.x+=boss.speed*boss.dir;




if(boss.x<=0 || boss.x+boss.w>=W){


boss.dir*=-1;


}






if(Math.random()<0.03){



enemyBullets.push({



x:boss.x+150,


y:boss.y+100,


w:8,


h:15,


speed:7



});



}



}







function drawBoss(){



if(!boss)

return;





ctx.fillStyle="purple";


ctx.fillRect(


boss.x,


boss.y,


boss.w,


boss.h


);





ctx.fillStyle="red";


ctx.fillRect(


150,


20,


500,


15


);





ctx.fillStyle="lime";


ctx.fillRect(


150,


20,


500*(boss.hp/boss.max),


15


);



}








function hitBoss(){



if(!boss)

return;




bullets.forEach(b=>{



if(hit(b,boss)){



b.y=-100;


boss.hp--;



}



});





if(boss.hp<=0){



boss=null;


coins+=100;


round++;


state="shop";



}



}








// ======================
// FINAL DO ROUND
// ======================


function checkRoundEnd(){



if(enemies.length==0 && !boss){



if(round%100==0){



createBoss();



}

else{



if(mode=="fases"){



if(round>=unlockedStages){



unlockedStages=round+1;



localStorage.setItem(

"unlockedStages",

unlockedStages

);



}



}



state="shop";



}



}



}








// ======================
// UPDATE EXTRA
// ======================


function updateRound(){



if(state!="playing")

return;



updateBoss();


hitBoss();


checkRoundEnd();



}







// ======================
// DESENHO EXTRA
// ======================


function drawExtra(){



if(state=="fases"){


drawStages();


}



if(boss){


drawBoss();


}



}







// ======================
// CONTROLE FASES
// ======================


document.addEventListener("keydown",e=>{



if(state=="fases"){



if(e.code=="ArrowDown"){


selectedStage++;


if(selectedStage>unlockedStages)

selectedStage=1;



}





if(e.code=="ArrowUp"){



selectedStage--;


if(selectedStage<1)

selectedStage=unlockedStages;



}





if(e.code=="Enter"){



round=selectedStage;


state="playing";


createEnemies();



}



}



});
// ======================
// PAUSE
// ======================


let pauseIndex=0;


let pauseMenu=[

"Continuar",

"Reiniciar fase",

"Alterar nome",

"Sair para menu"

];




function drawPause(){


ctx.fillStyle="rgba(0,0,0,0.8)";


ctx.fillRect(

0,

0,

W,

H

);



ctx.fillStyle="white";


ctx.font="40px Arial";


ctx.fillText(

"PAUSADO",

320,

100

);



ctx.font="25px Arial";



pauseMenu.forEach((p,i)=>{



ctx.fillStyle=

i==pauseIndex ? "yellow":"white";



ctx.fillText(

p,

300,

220+i*50

);



});



}






document.addEventListener("keydown",e=>{



if(e.code=="KeyP"){



if(state=="playing"){


state="pause";


pauseIndex=0;


}

else if(state=="pause"){


state="playing";


}



}





if(state=="pause"){



if(e.code=="ArrowDown"){



pauseIndex++;


if(pauseIndex>=pauseMenu.length)

pauseIndex=0;



}





if(e.code=="ArrowUp"){



pauseIndex--;


if(pauseIndex<0)

pauseIndex=pauseMenu.length-1;



}





if(e.code=="Enter"){



if(pauseIndex==0){


state="playing";


}



if(pauseIndex==1){


startGame();


}



if(pauseIndex==2){



let n=prompt("Novo nome:");



if(n){


playerName=n;


localStorage.setItem(

"playerName",

n

);



}



}




if(pauseIndex==3){


state="menu";


bullets=[];

enemyBullets=[];

enemies=[];

boss=null;


}



}



}



});








// ======================
// GAME OVER
// ======================


function drawGameOver(){



ctx.fillStyle="red";


ctx.font="50px Arial";



ctx.fillText(

"GAME OVER",

250,

250

);



ctx.font="25px Arial";


ctx.fillText(

"ENTER voltar",

300,

330

);



}






document.addEventListener("keydown",e=>{



if(state=="gameover" && e.code=="Enter"){



state="menu";



}



});







// ======================
// SALVAMENTO
// ======================


setInterval(()=>{



localStorage.setItem(

"playerName",

playerName

);



localStorage.setItem(

"unlockedStages",

unlockedStages

);



},3000);







// ======================
// DRAW FINAL
// ======================


function draw(){



ctx.fillStyle="black";


ctx.fillRect(

0,

0,

W,

H

);





if(state=="menu"){



drawMenu();


return;


}





if(state=="gameover"){



drawGameOver();


return;


}





if(state=="pause"){



drawPause();


return;


}





if(state=="shop"){



drawShop();


return;


}






drawPlayer();


drawEnemies();


drawBullets();


drawEnemyBullets();


drawBoss();


drawHUD();



drawExtra();



}







// ======================
// UPDATE FINAL
// ======================


function update(){



if(state!="playing")

return;




updatePlayer();


updateEnemies();


updateBullets();


checkCollisions();


updateRound();



}







// ======================
// LOOP
// ======================


function loop(){



update();


draw();



requestAnimationFrame(loop);



}



loop();


</script>


</body>

</html>
