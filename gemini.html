<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_GRID - Neural Breach</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020408;
            --terminal-cyan: #00f0ff;
            --terminal-pink: #ff0055;
            --terminal-yellow: #f4ee01;
            --terminal-green: #00ff66;
            --panel-bg: rgba(0, 240, 255, 0.03);
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-deep);
            color: var(--terminal-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
        }

        /* Efeito Scanlines CRT */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .cyber-frame {
            background-color: var(--panel-bg);
            border: 1px solid var(--terminal-cyan);
            box-shadow: 0 0 25px var(--border-glow), inset 0 0 15px rgba(0, 240, 255, 0.05);
            padding: 25px;
            border-radius: 4px;
            width: 480px;
            position: relative;
        }

        /* Cantos decorativos estilo sci-fi */
        .cyber-frame::before {
            content: "SYSTEM_ACCESS // ROOT";
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-deep);
            padding: 0 8px;
            font-size: 11px;
            color: var(--terminal-pink);
            letter-spacing: 2px;
        }

        .header-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--terminal-cyan);
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--terminal-cyan);
        }

        .status-badge {
            font-size: 12px;
            background: rgba(255, 0, 85, 0.1);
            color: var(--terminal-pink);
            border: 1px solid var(--terminal-pink);
            padding: 2px 6px;
        }

        /* Seletor de Nível */
        .grid-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .btn-protocol {
            background: transparent;
            border: 1px solid var(--terminal-cyan);
            color: var(--terminal-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            padding: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-protocol:hover, .btn-protocol.active {
            background: var(--terminal-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 10px var(--terminal-cyan);
            font-weight: bold;
        }

        /* Painel de Telemetria */
        .telemetry-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px;
            text-align: center;
        }

        .telemetry-item span {
            display: block;
            color: var(--terminal-yellow);
            font-size: 16px;
            font-weight: bold;
        }

        /* Alvo / Input Box */
        .input-matrix {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            background: #000;
            border: 2px solid var(--terminal-cyan);
            color: var(--terminal-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px;
            text-align: center;
            padding: 6px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        input:focus {
            border-color: var(--terminal-yellow);
            color: var(--terminal-yellow);
        }

        .btn-hack {
            background: var(--terminal-cyan);
            color: var(--bg-deep);
            border: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 0 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-hack:hover {
            background: var(--terminal-yellow);
            box-shadow: 0 0 15px var(--terminal-yellow);
        }

        /* Ferramentas / Power-ups */
        .tools-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-tool {
            flex: 1;
            background: transparent;
            border: 1px dashed var(--terminal-yellow);
            color: var(--terminal-yellow);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            padding: 5px;
            cursor: pointer;
        }

        .btn-tool:hover:not(:disabled) {
            background: rgba(244, 238, 1, 0.15);
        }

        .btn-tool:disabled {
            border-color: #333;
            color: #444;
            cursor: not-allowed;
        }

        /* Log de Tráfego */
        #neural-log {
            background: #010204;
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px;
            height: 90px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            line-height: 1.3;
        }

        .log-error { color: var(--terminal-pink); }
        .log-success { color: var(--terminal-green); }
        .log-warn { color: var(--terminal-yellow); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="cyber-frame">
        <div class="header-grid">
            <h1>CYBER_GRID</h1>
            <div class="status-badge" id="net-status">OFFLINE</div>
        </div>

        <!-- Seletor de Protocolo (Dificuldade) -->
        <div class="grid-selector" id="protocol-selector">
            <button class="btn-protocol active" onclick="mudarProtocolo('alpha', 50, 8)">ALPHA [1-50]</button>
            <button class="btn-protocol" onclick="mudarProtocolo('beta', 100, 6)">BETA [1-100]</button>
            <button class="btn-protocol" onclick="mudarProtocolo('omega', 250, 5)">OMEGA [1-250]</button>
        </div>

        <!-- Telemetria do Hack -->
        <div class="telemetry-panel">
            <div class="telemetry-item">CHANCES<span id="stat-lives">8</span></div>
            <div class="telemetry-item">RANGE<span id="stat-range">1-50</span></div>
            <div class="telemetry-item">PING/TIME<span id="stat-timer">--</span></div>
        </div>

        <!-- Painel de Execução -->
        <div id="execution-panel">
            <div class="input-matrix">
                <input type="number" id="neural-input" placeholder="DIGITE O KERNEL" autocomplete="off">
                <button class="btn-hack" onclick="processarInvasao()">INJECT</button>
            </div>
            <div class="tools-row">
                <button class="btn-tool" id="tool-trace" onclick="executarTraceRoute()">[TRACE-ROUTE: PAR/ÍMPAR]</button>
                <button class="btn-tool" id="tool-halve" onclick="executarCutRange()">[OVERCLOCK: REDUZIR 50%]</button>
            </div>
        </div>

        <!-- Log de Saída Neural -->
        <div id="neural-log">
            > Conecte-se a um protocolo para iniciar a invasão...
        </div>

        <!-- Botão de Reconexão -->
        <button class="btn-hack hidden" id="btn-reconnect" onclick="iniciarSessao()" style="width: 100%; margin-top: 15px; padding: 10px;">RE-INICIALIZAR KERNEL</button>
    </div>

    <script>
        let protocolo = 'alpha';
        let maxRange = 50;
        let maxLives = 8;
        
        let targetKey = 0;
        let lives = 8;
        let minBound = 1;
        let maxBound = 50;
        let sessionActive = false;
        let traceUsado = false;
        let halveUsado = false;
        let timerId = null;
        let timeRemaining = 0;

        const netStatus = document.getElementById('net-status');
        const statLives = document.getElementById('stat-lives');
        const statRange = document.getElementById('stat-range');
        const statTimer = document.getElementById('stat-timer');
        const neuralInput = document.getElementById('neural-input');
        const neuralLog = document.getElementById('neural-log');
        const executionPanel = document.getElementById('execution-panel');
        const protocolSelector = document.getElementById('protocol-selector');
        const btnReconnect = document.getElementById('btn-reconnect');
        const toolTrace = document.getElementById('tool-trace');
        const toolHalve = document.getElementById('tool-halve');

        function mudarProtocolo(nome, range, vidas) {
            protocolo = nome;
            maxRange = range;
            maxLives = vidas;

            document.querySelectorAll('.btn-protocol').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            iniciarSessao();
        }

        function logMsg(texto, tipo = '') {
            let cls = '';
            if (tipo === 'erro') cls = 'log-error';
            if (tipo === 'sucesso') cls = 'log-success';
            if (tipo === 'aviso') cls = 'log-warn';

            neuralLog.innerHTML += `<div class="${cls}">> ${texto}</div>`;
            neuralLog.scrollTop = neuralLog.scrollHeight;
        }

        function iniciarSessao() {
            clearInterval(timerId);
            targetKey = Math.floor(Math.random() * maxRange) + 1;
            lives = maxLives;
            minBound = 1;
            maxBound = maxRange;
            sessionActive = true;
            traceUsado = false;
            halveUsado = false;

            statLives.textContent = lives;
            statRange.textContent = `${minBound}-${maxBound}`;
            neuralInput.value = '';
            neuralLog.innerHTML = `> Handshake completo. Alvo criptografado gerado [1-${maxRange}].`;
            
            netStatus.textContent = "ONLINE (BREACH)";
            netStatus.style.color = "var(--terminal-green)";
            netStatus.style.borderColor = "var(--terminal-green)";
            netStatus.style.background = "rgba(0, 255, 102, 0.1)";

            executionPanel.classList.remove('hidden');
            protocolSelector.classList.remove('hidden');
            btnReconnect.classList.add('hidden');
            toolTrace.disabled = false;
            toolHalve.disabled = false;

            // Timer dinâmico baseado no nível
            if (protocolo === 'beta') {
                timeRemaining = 45;
                iniciarTimer();
            } else if (protocolo === 'omega') {
                timeRemaining = 30;
                iniciarTimer();
            } else {
                statTimer.textContent = "ILIMITADO";
            }

            neuralInput.focus();
        }

        function iniciarTimer() {
            statTimer.textContent = `${timeRemaining}s`;
            timerId = setInterval(() => {
                timeRemaining--;
                statTimer.textContent = `${timeRemaining}s`;
                if (timeRemaining <= 0) {
                    clearInterval(timerId);
                    falharSessao("TIMEOUT DE REDE! O ICE NEURAL RASTREOU SEU SUCEDIDO.");
                }
            }, 1000);
        }

        function processarInvasao() {
            if (!sessionActive) return;
            const guess = Number(neuralInput.value);

            if (!neuralInput.value || guess < minBound || guess > maxBound) {
                logMsg(`Kernel inválido ou fora dos limites [${minBound}-${maxBound}].`, 'erro');
                return;
            }

            if (guess === targetKey) {
                concluirSucesso();
                return;
            }

            lives--;
            statLives.textContent = lives;

            if (lives <= 0) {
                falharSessao("INTEGRIDADE ZERO! ACESSO BLOQUEADO PELO FIREWALL.");
                return;
            }

            if (guess < targetKey) {
                if (guess >= minBound) minBound = guess + 1;
                logMsg(`Rejeitado: Kernel ALVO é MAIOR. Novo setor: [${minBound}-${maxBound}]`, 'erro');
            } else {
                if (guess <= maxBound) maxBound = guess - 1;
                logMsg(`Rejeitado: Kernel ALVO é MENOR. Novo setor: [${minBound}-${maxBound}]`, 'erro');
            }

            statRange.textContent = `${minBound}-${maxBound}`;
            neuralInput.value = '';
            neuralInput.focus();
        }

        function executarTraceRoute() {
            if (!sessionActive || traceUsado) return;
            traceUsado = true;
            toolTrace.disabled = true;

            const paridade = targetKey % 2 === 0 ? "PAR" : "ÍMPAR";
            logMsg(`TRACE-ROUTE EXECUTADO: O kernel é um número ${paridade}.`, 'aviso');
            neuralInput.focus();
        }

        function executarCutRange() {
            if (!sessionActive || halveUsado) return;
            halveUsado = true;
            toolHalve.disabled = true;

            // Restringe o escopo dinamicamente cortando 50% da área errada
            const meio = Math.floor((minBound + maxBound) / 2);
            if (targetKey <= meio) {
                maxBound = meio;
                logMsg(`OVERCLOCK ATIVO: Setor superior eliminado. Novo escopo: [${minBound}-${maxBound}]`, 'aviso');
            } else {
                minBound = meio + 1;
                logMsg(`OVERCLOCK ATIVO: Setor inferior eliminado. Novo escopo: [${minBound}-${maxBound}]`, 'aviso');
            }
            statRange.textContent = `${minBound}-${maxBound}`;
            neuralInput.focus();
        }

        function concluirSucesso() {
            sessionActive = false;
            clearInterval(timerId);
            netStatus.textContent = "BREACH CONCLUÍDO";
            netStatus.style.color = "var(--terminal-green)";
            
            logMsg(`ACESSO CONCEDIDO! Chave Neural [${targetKey}] decodificada com sucesso.`, 'sucesso');
            finalizarInterface();
        }

        function falharSessao(motivo) {
            sessionActive = false;
            clearInterval(timerId);
            netStatus.textContent = "ALERTA DE INTRUSÃO";
            netStatus.style.color = "var(--terminal-pink)";
            
            logMsg(motivo, 'erro');
            logMsg(`A chave correta era: ${targetKey}`, 'aviso');
            finalizarInterface();
        }

        function finalizarInterface() {
            executionPanel.classList.add('hidden');
            protocolSelector.classList.add('hidden');
            btnReconnect.classList.remove('hidden');
        }

        neuralInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processarInvasao();
        });

        // Inicializar automático
        iniciarSessao();
    </script>

</body>
</html>
