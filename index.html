<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Invaders</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #05070d;
      color: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      box-sizing: border-box;
    }
    a {
      color: #7ad5ff;
      text-decoration: none;
      font-weight: bold;
    }
    iframe {
      width: min(100vw - 24px, 960px);
      height: min(100vh - 90px, 720px);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
      background: #000;
    }
  </style>
</head>
<body>
  <a href="SpaceInvaders1.html">Abrir o jogo em tela cheia</a>
  <iframe src="SpaceInvaders1.html" title="Space Invaders"></iframe>
</body>
</html>
