<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Island - Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    margin: 10px 0 5px;
    font-size: 1.4rem;
    color: #f0c040;
    text-shadow: 0 0 8px #f0c04055;
  }
  #game-container {
    position: relative;
    border: 3px solid #4a3f2a;
    box-shadow: 0 0 20px #000a;
    border-radius: 4px;
  }
  canvas {
    display: block;
    background: #2d5a27;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
  }
  #inventory {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 180px;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 16px 24px;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
    display: none;
    z-index: 10;
    max-width: 320px;
    border: 2px solid #f0c040;
  }
  #controls {
    margin-top: 8px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
  .bar {
    display: inline-block;
    width: 80px;
    height: 8px;
    background: #333;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.2s;
  }
</style>
</head>
<body>
  <h1>🏝️ Fantasy Island</h1>
  <div id="game-container">
    <canvas id="c" width="800" height="500"></canvas>
    <div id="ui">
      <div>❤️ Vida: <span id="hp">100</span>
        <span class="bar"><span class="bar-fill" id="hp-bar" style="width:100%;background:#e74c3c"></span></span>
      </div>
      <div>⭐ XP: <span id="xp">0</span></div>
      <div>📖 Conhecimento: <span id="knowledge">0</span></div>
    </div>
    <div id="inventory">
      <strong>Inventário</strong><br>
      🪵 Madeira: <span id="wood">0</span><br>
      🪨 Pedra: <span id="stone">0</span><br>
      🌿 Fibra: <span id="fiber">0</span><br>
      🎣 Isca: <span id="bait">0</span>
    </div>
    <div id="message"></div>
  </div>
  <div id="controls">
    WASD / Setas = mover · E = interagir / coletar · C = craftar isca (2 madeira + 1 fibra) · I = diário
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ========== ESTADO ==========
const player = {
  x: 400, y: 250,
  size: 16,
  speed: 2.4,
  hp: 100,
  maxHp: 100,
  xp: 0,
  knowledge: 0,
  inv: { wood: 0, stone: 0, fiber: 0, bait: 0 }
};

const keys = {};
let messageTimer = 0;
let messageText = '';
let showJournal = false;

// Recursos no mapa
const resources = [];
const creatures = [];
const trees = [];
const rocks = [];
const fibers = [];

// Gera mundo
function generateWorld() {
  // Árvores
  for (let i = 0; i < 25; i++) {
    trees.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      size: 18 + Math.random() * 8,
      hp: 3
    });
  }
  // Rochas
  for (let i = 0; i < 18; i++) {
    rocks.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      size: 12 + Math.random() * 6,
      hp: 2
    });
  }
  // Fibras
  for (let i = 0; i < 20; i++) {
    fibers.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      size: 10,
      collected: false
    });
  }
  // Criaturas (dragoes e outros)
  const types = [
    { name: 'Dragãozinho', color: '#e74c3c', tameDiff: 3, size: 22 },
    { name: 'Fada', color: '#9b59b6', tameDiff: 2, size: 14 },
    { name: 'Lobo Mágico', color: '#3498db', tameDiff: 4, size: 18 },
    { name: 'Drake', color: '#f39c12', tameDiff: 5, size: 26 }
  ];
  for (let i = 0; i < 6; i++) {
    const t = types[Math.floor(Math.random() * types.length)];
    creatures.push({
      x: 60 + Math.random() * (W - 120),
      y: 60 + Math.random() * (H - 120),
      ...t,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      observed: false,
      tamed: false,
      trust: 0
    });
  }
}

generateWorld();

// ========== INPUT ==========
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') interact();
  if (e.key.toLowerCase() === 'c') craft();
  if (e.key.toLowerCase() === 'i') showJournal = !showJournal;
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ========== LÓGICA ==========
function showMsg(txt, time = 120) {
  messageText = txt;
  messageTimer = time;
  const el = document.getElementById('message');
  el.style.display = 'block';
  el.innerHTML = txt;
}

function interact() {
  // Coletar árvore
  for (let i = trees.length - 1; i >= 0; i--) {
    const t = trees[i];
    if (dist(player, t) < 28) {
      t.hp--;
      if (t.hp <= 0) {
        player.inv.wood += 2 + Math.floor(Math.random() * 2);
        trees.splice(i, 1);
        showMsg('🪵 + Madeira!');
        player.xp += 5;
      } else {
        showMsg('Cortando árvore...');
      }
      updateUI();
      return;
    }
  }
  // Coletar pedra
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    if (dist(player, r) < 26) {
      r.hp--;
      if (r.hp <= 0) {
        player.inv.stone += 1 + Math.floor(Math.random() * 2);
        rocks.splice(i, 1);
        showMsg('🪨 + Pedra!');
        player.xp += 4;
      } else {
        showMsg('Minerando...');
      }
      updateUI();
      return;
    }
  }
  // Coletar fibra
  for (let i = fibers.length - 1; i >= 0; i--) {
    const f = fibers[i];
    if (!f.collected && dist(player, f) < 22) {
      f.collected = true;
      player.inv.fiber += 1;
      fibers.splice(i, 1);
      showMsg('🌿 + Fibra!');
      player.xp += 3;
      updateUI();
      return;
    }
  }
  // Observar / domestica criatura
  for (const c of creatures) {
    if (dist(player, c) < 40) {
      if (!c.observed) {
        c.observed = true;
        player.knowledge += 1;
        showMsg(`📖 Você observou um ${c.name}!<br>Conhecimento +1`);
        player.xp += 10;
        updateUI();
        return;
      }
      if (c.tamed) {
        showMsg(`${c.name} já é seu amigo! ❤️`);
        return;
      }
      if (player.inv.bait > 0 && player.knowledge >= c.tameDiff) {
        player.inv.bait--;
        c.trust += 1;
        if (c.trust >= c.tameDiff) {
          c.tamed = true;
          showMsg(`🎉 Você domesticou o ${c.name}!`);
          player.xp += 30;
        } else {
          showMsg(`Isca usada... confiança ${c.trust}/${c.tameDiff}`);
        }
        updateUI();
        return;
      } else if (player.inv.bait === 0) {
        showMsg('Precisa de isca! (C para craftar)');
      } else {
        showMsg(`Conhecimento insuficiente!<br>Precisa de ${c.tameDiff} (você tem ${player.knowledge})`);
      }
      return;
    }
  }
  showMsg('Nada perto...');
}

function craft() {
  if (player.inv.wood >= 2 && player.inv.fiber >= 1) {
    player.inv.wood -= 2;
    player.inv.fiber -= 1;
    player.inv.bait += 1;
    showMsg('🎣 Isca craftada!');
    player.xp += 8;
    updateUI();
  } else {
    showMsg('Precisa: 2 Madeira + 1 Fibra');
  }
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function updateUI() {
  document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
  document.getElementById('hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
  document.getElementById('xp').textContent = player.xp;
  document.getElementById('knowledge').textContent = player.knowledge;
  document.getElementById('wood').textContent = player.inv.wood;
  document.getElementById('stone').textContent = player.inv.stone;
  document.getElementById('fiber').textContent = player.inv.fiber;
  document.getElementById('bait').textContent = player.inv.bait;
}

function update() {
  // Movimento
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed;
    player.y += (dy / len) * player.speed;
    player.x = Math.max(player.size, Math.min(W - player.size, player.x));
    player.y = Math.max(player.size, Math.min(H - player.size, player.y));
  }

  // Criaturas andam
  for (const c of creatures) {
    if (c.tamed) {
      // Segue o player de longe
      const d = dist(player, c);
      if (d > 50) {
        c.x += (player.x - c.x) * 0.015;
        c.y += (player.y - c.y) * 0.015;
      }
    } else {
      c.x += c.vx;
      c.y += c.vy;
      if (c.x < 30 || c.x > W - 30) c.vx *= -1;
      if (c.y < 30 || c.y > H - 30) c.vy *= -1;
      // ocasionalmente muda direção
      if (Math.random() < 0.01) {
        c.vx = (Math.random() - 0.5) * 1.4;
        c.vy = (Math.random() - 0.5) * 1.4;
      }
    }
  }

  if (messageTimer > 0) {
    messageTimer--;
    if (messageTimer === 0) {
      document.getElementById('message').style.display = 'none';
    }
  }
}

// ========== RENDER ==========
function draw() {
  // Fundo
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, W, H);

  // Grama detalhe
  ctx.fillStyle = '#3a7a32';
  for (let i = 0; i < 80; i++) {
    const gx = (i * 97) % W;
    const gy = (i * 53) % H;
    ctx.fillRect(gx, gy, 3, 3);
  }

  // Fibras
  for (const f of fibers) {
    if (f.collected) continue;
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#558b2f';
    ctx.fillRect(f.x - 2, f.y - 6, 4, 8);
  }

  // Rochas
  for (const r of rocks) {
    ctx.fillStyle = '#78909c';
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.size, r.size * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#546e7a';
    ctx.beginPath();
    ctx.ellipse(r.x - 3, r.y - 2, r.size * 0.4, r.size * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Árvores
  for (const t of trees) {
    // tronco
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(t.x - 4, t.y, 8, 14);
    // copa
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.arc(t.x, t.y - 6, t.size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#388e3c';
    ctx.beginPath();
    ctx.arc(t.x - 5, t.y - 10, t.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Criaturas
  for (const c of creatures) {
    ctx.fillStyle = c.tamed ? '#2ecc71' : c.color;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
    ctx.fill();
    // olhos
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(c.x - 4, c.y - 3, 3, 0, Math.PI * 2);
    ctx.arc(c.x + 4, c.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(c.x - 4, c.y - 3, 1.5, 0, Math.PI * 2);
    ctx.arc(c.x + 4, c.y - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // nome
    ctx.fillStyle = c.tamed ? '#2ecc71' : '#fff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name + (c.tamed ? ' ❤️' : ''), c.x, c.y - c.size / 2 - 6);
  }

  // Player
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(player.x - 4, player.y - 3, 3, 0, Math.PI * 2);
  ctx.arc(player.x + 4, player.y - 3, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(player.x - 4, player.y - 3, 1.5, 0, Math.PI * 2);
  ctx.arc(player.x + 4, player.y - 3, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Journal overlay
  if (showJournal) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(100, 60, 600, 380);
    ctx.strokeStyle = '#f0c040';
    ctx.lineWidth = 3;
    ctx.strokeRect(100, 60, 600, 380);
    ctx.fillStyle = '#f0c040';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('📖 Diário de Criaturas', 400, 100);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#eee';
    ctx.textAlign = 'left';
    let y = 140;
    creatures.forEach((c, i) => {
      const status = c.tamed ? '✅ Domesticado' : c.observed ? `👁 Observado (confiança ${c.trust}/${c.tameDiff})` : '❓ Desconhecido';
      ctx.fillText(`${i + 1}. ${c.name} — ${status}`, 140, y);
      y += 28;
    });
    ctx.fillStyle = '#aaa';
    ctx.fillText('Pressione I para fechar', 140, 410);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateUI();
showMsg('Bem-vindo à Fantasy Island!<br>Explore, colete e domestique criaturas.', 180);
loop();
</script>
</body>
</html>
