<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Quest - Ultimate Edition</title>
    <style>
        body {
            background-color: #0b0b14;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #ui {
            font-size: 13px;
            margin-bottom: 8px;
            background: #1a1a2e;
            padding: 6px 12px;
            border: 2px solid #4a4e69;
            display: flex;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas {
            border: 4px solid #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            background-color: #2b4c2b;
        }
        .controls {
            margin-top: 8px;
            font-size: 11px;
            color: #a0a0a0;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Pixel Quest: Edição Definitiva</h1>
    <div id="ui">
        <span id="statHp">HP: 100/100</span>
        <span id="statGold">Ouro: 0</span>
        <span id="statAttack">Dano: 15</span>
        <span id="statArea">Local: Vila Segura</span>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls">
        <b>W,A,S,D</b>: Mover | <b>ESPAÇO</b>: Atacar | <b>E</b>: Interagir/Loja | <b>Q</b>: Poção | <b>F</b>: Dash | <b>ESC</b>: Menu / Pausa
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        // Estados: menu, playing, paused, gameover
        let gameState = "menu"; 
        let menuIndex = 0;
        let currentArea = "village";
        let screenShake = 0;
        let flashRed = 0;
        let gameTime = 0;

        // Jogador
        const player = {
            x: 300,
            y: 200,
            size: 16,
            speed: 3.2,
            hp: 100,
            maxHp: 100,
            gold: 0,
            attack: 15,
            potions: 0,
            dashCooldown: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: "down"
        };

        let monsters = [];
        let projectiles = [];
        let particles = [];
        let achievements = [];
        let unlockedAchievements = {};

        // Configuração Inicial de Conquistas
        const allAchievements = [
            { id: "slacker", title: "Caçador Iniciante", desc: "Derrote seu primeiro monstro." },
            { id: "rich", title: "Rico em Ouro", desc: "Acumule 100 de ouro." },
            { id: "warrior", title: "Guerreiro Forte", desc: "Alcance 35 de dano." }
        ];

        // Teclado Unificado
        const keys = {};
        window.addEventListener("keydown", e => {
            let key = e.key.toLowerCase();
            keys[key] = true;

            if (gameState === "menu") {
                if (e.key === "ArrowUp" || key === "w") {
                    menuIndex = (menuIndex - 1 + 4) % 4;
                } else if (e.key === "ArrowDown" || key === "s") {
                    menuIndex = (menuIndex + 1) % 4;
                } else if (e.key === "Enter" || key === " ") {
                    handleMenuSelection();
                }
            } else if (gameState === "paused") {
                if (key === "escape") {
                    gameState = "playing";
                }
            } else if (gameState === "playing") {
                if (key === "escape") {
                    gameState = "paused";
                }
                if (e.key === " " && !player.isAttacking) {
                    player.isAttacking = true;
                    player.attackTimer = 12;
                    playSound("slash");
                }
                if (key === "e") {
                    checkInteraction();
                }
                if (key === "q" && player.potions > 0 && player.hp < player.maxHp) {
                    player.potions--;
                    player.hp = Math.min(player.maxHp, player.hp + 50);
                    createFloatingText("+50 HP (Poção)", player.x, player.y - 15, "#2ecc71");
                    playSound("potion");
                }
                if (key === "f" && player.dashCooldown === 0) {
                    player.dashCooldown = 60;
                    let dashDist = 45;
                    if (player.facing === "up") player.y -= dashDist;
                    if (player.facing === "down") player.y += dashDist;
                    if (player.facing === "left") player.x -= dashDist;
                    if (player.facing === "right") player.x += dashDist;
                    createFloatingText("DASH!", player.x, player.y - 15, "#00ffcc");
                    playSound("dash");
                }
            }
        });
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Sistema de Som Simples com Web Audio API (Sem arquivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === "slash") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === "coin") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === "dash") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === "potion") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function handleMenuSelection() {
            if (menuIndex === 0) { // Continuar / Novo Jogo
                gameState = "playing";
            } else if (menuIndex === 1) { // Carregar Jogo
                loadGame();
            } else if (menuIndex === 2) { // Salvar Jogo
                saveGame();
            } else if (menuIndex === 3) { // Sair / Reiniciar
                resetGame();
                gameState = "playing";
            }
        }

        // Funções de Salvar e Carregar via LocalStorage
        function saveGame() {
            let saveData = {
                player,
                currentArea,
                gameTime,
                unlockedAchievements
            };
            localStorage.setItem("pixelQuestSave", JSON.stringify(saveData));
            createFloatingText("JOGO SALVO COM SUCESSO!", canvas.width / 2, 50, "#ffd700");
        }

        function loadGame() {
            let saved = localStorage.getItem("pixelQuestSave");
            if (saved) {
                let data = JSON.parse(saved);
                Object.assign(player, data.player);
                currentArea = data.currentArea;
                gameTime = data.gameTime;
                unlockedAchievements = data.unlockedAchievements || {};
                gameState = "playing";
                createFloatingText("JOGO CARREGADO!", canvas.width / 2, 50, "#2ecc71");
            } else {
                createFloatingText("NENHUM SALVAMENTO ENCONTRADO", canvas.width / 2, 50, "#e74c3c");
            }
        }

        function resetGame() {
            player.x = 300; player.y = 200;
            player.hp = 100; player.maxHp = 100;
            player.gold = 0; player.attack = 15; player.potions = 0;
            currentArea = "village";
            monsters = [];
            projectiles = [];
            gameTime = 0;
        }

        // Mapa e Coordenadas do Mundo
        const areas = {
            village: { name: "Vila Segura", color: "#3e5c3e" },
            forest: { name: "Floresta dos Slimes", color: "#1e3f20" },
            cave: { name: "Caverna Sombria", color: "#1f1f2e" },
            ruins: { name: "Ruínas Antigas", color: "#4a3b2c" },
            desert: { name: "Deserto Ardente", color: "#7a622c" }
        };

        function changeArea(newArea) {
            currentArea = newArea;
            monsters = [];
            projectiles = [];
            
            if (newArea === "forest") spawnMonsters("slime", 5);
            if (newArea === "cave") spawnMonsters("goblin", 4);
            if (newArea === "ruins") spawnMonsters("skeleton", 4);
            if (newArea === "desert") spawnMonsters("dragon", 2);
        }

        function spawnMonsters(type, count) {
            for (let i = 0; i < count; i++) {
                let mData = getMonsterStats(type);
                monsters.push({
                    type: type,
                    x: Math.random() * (canvas.width - 100) + 50,
                    y: Math.random() * (canvas.height - 100) + 50,
                    size: mData.size,
                    hp: mData.hp,
                    maxHp: mData.hp,
                    speed: mData.speed,
                    damage: mData.damage,
                    color: mData.color,
                    shootTimer: 0
                });
            }
        }

        function getMonsterStats(type) {
            switch(type) {
                case "slime": return { hp: 35, speed: 1.2, damage: 6, size: 14, color: "#2ecc71" };
                case "goblin": return { hp: 60, speed: 1.8, damage: 10, size: 16, color: "#e67e22" };
                case "skeleton": return { hp: 50, speed: 1.0, damage: 12, size: 16, color: "#dcdde1" };
                case "dragon": return { hp: 120, speed: 1.5, damage: 18, size: 22, color: "#e74c3c" };
            }
        }

        function checkInteraction() {
            if (currentArea !== "village") return;

            // Ferreiro (Esquerda) - Dano
            if (Math.hypot(player.x - 150, player.y - 200) < 40) {
                let cost = 30;
                if (player.gold >= cost) {
                    player.gold -= cost;
                    player.attack += 6;
                    createFloatingText("+6 Dano!", 150, 170, "#3498db");
                    checkAchievement("warrior");
                } else {
                    createFloatingText(`Falta Ouro (Custa ${cost})`, 150, 170, "#e74c3c");
                }
            }
            // Alquimista (Direita) - Poção
            if (Math.hypot(player.x - 450, player.y - 200) < 40) {
                let cost = 20;
                if (player.gold >= cost) {
                    player.gold -= cost;
                    player.potions++;
                    createFloatingText("+1 Poção!", 450, 170, "#2ecc71");
                } else {
                    createFloatingText(`Falta Ouro (Custa ${cost})`, 450, 170, "#e74c3c");
                }
            }
        }

        function createFloatingText(text, x, y, color) {
            particles.push({ text, x, y, color, life: 45, type: "text" });
        }

        function createHitSparks(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    color,
                    life: 20,
                    type: "spark"
                });
            }
        }

        function checkAchievement(id) {
            if (!unlockedAchievements[id]) {
                unlockedAchievements[id] = true;
                let ach = allAchievements.find(a => a.id === id);
                if (ach) {
                    achievements.push({ title: `Conquista: ${ach.title}`, life: 180 });
                }
            }
        }

        function update() {
            if (gameState !== "playing") return;

            gameTime++;
            if (screenShake > 0) screenShake--;
            if (flashRed > 0) flashRed--;
            if (player.dashCooldown > 0) player.dashCooldown--;

            let dx = 0, dy = 0;
            if (keys["w"] || keys["arrowup"]) { dy = -1; player.facing = "up"; }
            if (keys["s"] || keys["arrowdown"]) { dy = 1; player.facing = "down"; }
            if (keys["a"] || keys["arrowleft"]) { dx = -1; player.facing = "left"; }
            if (keys["d"] || keys["arrowright"]) { dx = 1; player.facing = "right"; }

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            // Transição de Áreas
            if (currentArea === "village") {
                if (player.x < 15) { changeArea("forest"); player.x = canvas.width - 30; }
                if (player.x > canvas.width - 15) { changeArea("cave"); player.x = 30; }
                if (player.y < 15) { changeArea("ruins"); player.y = canvas.height - 30; }
                if (player.y > canvas.height - 15) { changeArea("desert"); player.y = 30; }
                
                player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
                player.y = Math.max(15, Math.min(canvas.height - 15, player.y));
            } else {
                if (player.x < 10 || player.x > canvas.width - 10 || player.y < 10 || player.y > canvas.height - 10) {
                    changeArea("village");
                    player.x = canvas.width / 2;
                    player.y = canvas.height / 2;
                }
            }

            // Ataque
            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;

                monsters.forEach(m => {
                    let dist = Math.hypot(player.x - m.x, player.y - m.y);
                    if (dist < 32) {
                        m.hp -= player.attack;
                        createHitSparks(m.x, m.y, "#ffffff");
                        createFloatingText("-" + player.attack, m.x, m.y - 12, "#ffdd59");
                        m.x += (m.x - player.x) * 0.4;
                        m.y += (m.y - player.y) * 0.4;
                    }
                });
            }

            projectiles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                if (Math.hypot(player.x - p.x, player.y - p.y) < 14) {
                    player.hp -= p.damage;
                    flashRed = 10;
                    screenShake = 8;
                    projectiles.splice(index, 1);
                    if (player.hp <= 0) { player.hp = 0; gameState = "gameover"; }
                } else if (p.life <= 0) {
                    projectiles.splice(index, 1);
                }
            });

            monsters.forEach((m, index) => {
                if (currentArea !== "village") {
                    let angle = Math.atan2(player.y - m.y, player.x - m.x);
                    m.x += Math.cos(angle) * m.speed;
                    m.y += Math.sin(angle) * m.speed;

                    if (m.type === "skeleton") {
                        m.shootTimer++;
                        if (m.shootTimer > 90) {
                            m.shootTimer = 0;
                            projectiles.push({
                                x: m.x, y: m.y,
                                vx: Math.cos(angle) * 3,
                                vy: Math.sin(angle) * 3,
                                damage: 10,
                                life: 120
                            });
                        }
                    }

                    if (Math.hypot(player.x - m.x, player.y - m.y) < 16) {
                        player.hp -= 0.6;
                        flashRed = 5;
                        if (player.hp <= 0) { player.hp = 0; gameState = "gameover"; }
                    }
                }

                if (m.hp <= 0) {
                    let reward = m.type === "slime" ? 12 : m.type === "goblin" ? 22 : m.type === "skeleton" ? 30 : 50;
                    player.gold += reward;
                    playSound("coin");
                    createHitSparks(m.x, m.y, m.color);
                    createFloatingText("+" + reward + " G", m.x, m.y, "#ffd700");
                    
                    checkAchievement("slacker");
                    if (player.gold >= 100) checkAchievement("rich");

                    monsters.splice(index, 1);

                    if (monsters.length === 0) {
                        setTimeout(() => {
                            if (currentArea === "forest") spawnMonsters("slime", 5);
                            if (currentArea === "cave") spawnMonsters("goblin", 4);
                            if (currentArea === "ruins") spawnMonsters("skeleton", 4);
                            if (currentArea === "desert") spawnMonsters("dragon", 3);
                        }, 2500);
                    }
                }
            });

            particles.forEach((p, index) => {
                if (p.type === "text") { p.y -= 0.4; p.life--; } 
                else if (p.type === "spark") { p.x += p.vx; p.y += p.vy; p.life--; }
                if (p.life <= 0) particles.splice(index, 1);
            });

            achievements.forEach((a, index) => {
                a.life--;
                if (a.life <= 0) achievements.splice(index, 1);
            });

            document.getElementById("statHp").innerText = `HP: ${Math.ceil(player.hp)}/${player.maxHp}`;
            document.getElementById("statGold").innerText = `Ouro: ${player.gold} | Poções: ${player.potions}`;
            document.getElementById("statAttack").innerText = `Dano: ${player.attack}`;
            document.getElementById("statArea").innerText = `Local: ${areas[currentArea].name}`;
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) {
                let shakeX = (Math.random() - 0.5) * 6;
                let shakeY = (Math.random() - 0.5) * 6;
                ctx.translate(shakeX, shakeY);
            }

            // Renderização do Menu Inicial
            if (gameState === "menu") {
                ctx.fillStyle = "#0b0b14";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffd700";
                ctx.font = "bold 26px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("PIXEL QUEST: ULTIMATE", canvas.width / 2, 80);

                let options = ["Continuar / Novo Jogo", "Carregar Jogo", "Salvar Jogo Atual", "Reiniciar Aventura"];
                options.forEach((opt, idx) => {
                    ctx.fillStyle = (idx === menuIndex) ? "#00ffcc" : "#ffffff";
                    ctx.font = (idx === menuIndex) ? "bold 16px 'Courier New'" : "15px 'Courier New'";
                    ctx.fillText((idx === menuIndex ? "> " : "  ") + opt, canvas.width / 2, 160 + (idx * 40));
                });

                ctx.fillStyle = "#888888";
                ctx.font = "11px 'Courier New'";
                ctx.fillText("Use SETAS [Cima/Baixo] e [ENTER] para selecionar", canvas.width / 2, 340);
                ctx.textAlign = "left";
                ctx.restore();
                return;
            }

            // Fundo
            ctx.fillStyle = areas[currentArea].color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (currentArea === "village") {
                ctx.fillStyle = "#4a4e69";
                ctx.fillRect(150, 100, 300, 200);

                ctx.fillStyle = "#8b4513";
                ctx.fillRect(120, 170, 60, 60);
                ctx.fillStyle = "#ffd700";
                ctx.font = "10px 'Courier New'";
                ctx.fillText("[E] +6 Dano (30g)", 95, 155);

                ctx.fillStyle = "#5d3587";
                ctx.fillRect(420, 170, 60, 60);
                ctx.fillText("[E] +1 Poção (20g)", 405, 155);

                ctx.fillStyle = "#ffffff";
                ctx.font = "11px 'Courier New'";
                ctx.fillText("▲ Ruínas", canvas.width / 2 - 25, 20);
                ctx.fillText("▼ Deserto", canvas.width / 2 - 30, canvas.height - 10);
                ctx.fillText("◄ Floresta", 15, canvas.height / 2);
                ctx.fillText("Caverna ►", canvas.width - 80, canvas.height / 2);
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.font = "11px 'Courier New'";
                ctx.fillText("◄ Voltar para a Vila (Vá para a borda)", 20, 25);
            }

            // Jogador
            ctx.fillStyle = "#3498db";
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);

            if (player.isAttacking) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                let ex = player.x, ey = player.y;
                if (player.facing === "right") ctx.fillRect(ex + 8, ey - 12, 10, 24);
                if (player.facing === "left") ctx.fillRect(ex - 18, ey - 12, 10, 24);
                if (player.facing === "up") ctx.fillRect(ex - 12, ey - 18, 24, 10);
                if (player.facing === "down") ctx.fillRect(ex - 12, ey + 8, 24, 10);
            }

            monsters.forEach(m => {
                ctx.fillStyle = m.color;
                ctx.fillRect(m.x - m.size/2, m.y - m.size/2, m.size, m.size);

                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(m.x - 14, m.y - m.size - 6, 28, 3);
                ctx.fillStyle = "#2ecc71";
                ctx.fillRect(m.x - 14, m.y - m.size - 6, (m.hp / m.maxHp) * 28, 3);
            });

            projectiles.forEach(p => {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                if (p.type === "text") {
                    ctx.font = "bold 11px 'Courier New'";
                    ctx.fillText(p.text, p.x, p.y);
                } else if (p.type === "spark") {
                    ctx.fillRect(p.x, p.y, 3, 3);
                }
            });

            // Popups de Conquistas no Canto Superior Esquerdo
            achievements.forEach((a, idx) => {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(10, 40 + (idx * 25), 200, 22);
                ctx.strokeStyle = "#ffd700";
                ctx.strokeRect(10, 40 + (idx * 25), 200, 22);
                ctx.fillStyle = "#ffd700";
                ctx.font = "10px 'Courier New'";
                ctx.fillText(a.title, 15, 55 + (idx * 25));
            });

            if (flashRed > 0) {
                ctx.fillStyle = "rgba(231, 76, 60, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            drawMinimap();

            // Tela de Pausa
            if (gameState === "paused") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("JOGO PAUSADO", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "13px 'Courier New'";
                ctx.fillText("Pressione [ESC] para voltar ao jogo", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }

            // Game Over
            if (gameState === "gameover") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 24px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("VOCÊ FOI DERROTADO", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "13px 'Courier New'";
                ctx.fillText("Atualize a página para tentar novamente", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }

            ctx.restore();
        }

        function drawMinimap() {
            let mapX = canvas.width - 95;
            let mapY = 15;
            let mapW = 80;
            let mapH = 60;

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(mapX, mapY, mapW, mapH);
            ctx.strokeStyle = "#ffffff";
            ctx.strokeRect(mapX, mapY, mapW, mapH);

            let bx = mapX + mapW / 2 - 8;
            let by = mapY + mapH / 2 - 8;

            ctx.fillStyle = currentArea === "village" ? "#f1c40f" : "#7f8c8d";
            ctx.fillRect(bx, by, 16, 16); 

            ctx.fillStyle = currentArea === "forest" ? "#2ecc71" : "#27ae60";
            ctx.fillRect(bx - 22, by, 14, 14); 

            ctx.fillStyle = currentArea === "cave" ? "#e67e22" : "#d35400";
            ctx.fillRect(bx + 22, by, 14, 14); 

            ctx.fillStyle = currentArea === "ruins" ? "#bdc3c7" : "#95a5a6";
            ctx.fillRect(bx, by - 20, 14, 14); 

            ctx.fillStyle = currentArea === "desert" ? "#f39c12" : "#d68910";
            ctx.fillRect(bx, by + 20, 14, 14); 
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
